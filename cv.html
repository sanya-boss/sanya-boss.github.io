<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="shortcut icon" type="image/png" href="./favicon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./ds-base.js"></script>
<script src="./image-slot.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:auto}
body{margin:0;background:var(--ink-2);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:opacity 120ms cubic-bezier(.16,1,.3,1)}
a:hover{opacity:.55}
::selection{background:var(--chalk-0);color:var(--ink-1)}
:root[data-theme="light"]{
  --ink-0:#FBF9F4;--ink-1:#F4F1E9;--ink-2:#EDE9DF;--ink-3:#E3DED2;
  --chalk-0:#17170f;--chalk-1:#3e3a31;--chalk-2:#5d5849;--chalk-3:#7b7565;
  --border-strong:rgba(23,23,15,0.2);--border-hairline:rgba(23,23,15,0.12);
  --text-primary:#17170f;--text-secondary:#3e3a31;--text-tertiary:#5d5849;
}
:root[data-theme="light"] [data-m="shade"]{background:linear-gradient(180deg,rgba(244,241,233,0.78),rgba(244,241,233,0.86) 45%,rgba(244,241,233,0.92))!important}
:root[data-theme="light"] [data-m="ambient"] iframe{filter:blur(14px) saturate(0.8) brightness(1.08)!important;opacity:0.5!important}
[data-m="theme-btn"],[data-m="lang-btn"]{background:transparent;color:var(--chalk-1)}
:root[data-lang="en"] [data-m="spaghetti"]{display:block!important}
[data-m="plinko-btn"]{transition:background 120ms,color 120ms,opacity 120ms}
[data-m="plinko-btn"]:hover:not(:disabled){background:var(--chalk-0);color:var(--ink-1)}
[data-m="plinko-btn"]:focus-visible{outline:1px solid var(--chalk-0);outline-offset:3px}
[data-m="plinko-btn"]:active:not(:disabled){transform:scale(0.985)}
[data-m="plinko-btn"]:disabled{opacity:0.45;cursor:not-allowed}
[data-m="plinko-bucket"]{transition:background 160ms,color 160ms,border-color 160ms}
@media(max-width:1100px),(max-height:799px){[data-m="plinko"]{display:none!important}}
[data-m="theme-btn"]:hover,[data-m="lang-btn"]:hover{color:var(--chalk-0)}
:root[data-lang="ru"] [data-m="lang-btn"][data-val="ru"],
:root[data-lang="et"] [data-m="lang-btn"][data-val="et"],
:root[data-lang="en"] [data-m="lang-btn"][data-val="en"]{background:var(--chalk-0);color:var(--ink-1)}
:root[data-theme="dark"] [data-m="theme-btn"][data-val="dark"],
:root[data-theme="light"] [data-m="theme-btn"][data-val="light"]{background:var(--chalk-0);color:var(--ink-1)}
@media(max-width:760px){
  [data-m="right"]{text-align:left!important}
  [data-m="meta-row"]{flex-direction:column!important;gap:14px!important}
  [data-m="hero"]{flex-direction:column!important;align-items:flex-start!important}
  [data-m="portrait"]{flex:1 1 auto!important;width:100%!important;max-width:none!important;aspect-ratio:4/5!important}
  [data-m="portrait"] image-slot{width:100%!important;height:100%!important}
  [data-m="row"]{gap:6px 0!important}
  [data-m="row"] > *{flex:1 1 100%!important;max-width:none!important}
  [data-m="lede"]{flex-direction:column!important;align-items:flex-start!important}
  [data-m="contact-foot"]{flex-direction:column!important;align-items:flex-start!important}
  [data-m="first-screen"]{min-height:0!important;padding-top:14px!important}
  [data-m="page"]{padding-top:58px!important}
  [data-m="nav-inner"]{flex-wrap:nowrap!important;gap:12px!important;padding:9px clamp(16px,4vw,24px)!important}
  [data-m="nav-links"]{display:none!important}
  [data-m="nav-controls"]{display:none!important}
  [data-m="burger"]{display:inline-flex!important}
  [data-m="panel"]{display:flex!important}
  [data-m="lede"]{border-top:0!important;padding-top:0!important;margin-top:22px!important}
  [data-m="proj-tags"]{margin-left:0!important}
  [data-m="hero-col"]{flex:0 0 auto!important;width:100%!important}
  [data-m="hero"] h1{font-size:clamp(38px,13vw,72px)!important;width:auto!important;height:auto!important;flex:1 1 100%!important;min-width:0!important}
  [data-m="lede"] p{font-size:18px!important;flex:1 1 100%!important;min-width:0!important;max-width:none!important;width:auto!important;height:auto!important}
  [data-m="meta-row"]{font-size:10.5px!important}
}
@media(max-width:400px){
  [data-m="nav-links"]{font-size:9px!important}
}
@media(min-width:1200px){
  [data-m="lede"] p{max-width:820px!important}
}
@media(min-width:1101px) and (min-height:800px){
  [data-m="lede"]{border-top:0!important;padding-top:34px!important}
  [data-m="first-screen"]{padding-top:28px!important}
}
@media(max-width:1100px){
  [data-m="proj-title"]{flex:1 1 100%!important}
}
@media(max-width:1100px) and (min-width:761px){
  [data-m="proj-tags"]{margin-left:52px!important}
}
@media(max-height:900px) and (min-width:761px){
  [data-m="portrait"]{flex:0 0 auto!important;height:min(440px,38vh)!important;width:calc(min(440px,38vh) * 3 / 4)!important;aspect-ratio:auto!important}
  [data-m="portrait"] image-slot{width:100%!important;height:100%!important}
  [data-m="hero"] h1{height:auto!important;font-size:min(132px,11vh)!important}
  [data-m="first-screen"]{padding-top:clamp(20px,3vh,48px)!important}
  [data-m="hero"]{margin-top:clamp(16px,3vh,40px)!important}
}
</style>
</helmet>
<div style="color: var(--chalk-0); font: var(--weight-regular) var(--type-body)/var(--lh-body) 'Schibsted Grotesk','Manrope',Helvetica,Arial,sans-serif; letter-spacing: var(--track-tight); min-height:100vh;">

<sc-if value="{{ ambientOn }}" hint-placeholder-val="{{ true }}">
<div data-m="ambient" aria-hidden="true" style="position:fixed;inset:-40px;z-index:-2;overflow:hidden;pointer-events:none;background:var(--ink-2)">
<iframe ref="{{ videoRef }}" src="{{ ambientSrc }}" title="" tabindex="-1" style="position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;border:0;transform:translate(-50%,-50%);opacity:.9;filter:grayscale(1) contrast(1.05) brightness(.8)"></iframe>
</div>
<div data-m="shade" aria-hidden="true" style="position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(22,22,21,0.72),rgba(22,22,21,0.84) 45%,rgba(22,22,21,0.92))"></div>
</sc-if>

</div>
</x-dc>
</body>
</html>
